# @Description: token-tracker 后端与 Tauri 桌面壳清单。

[package]
name = "token-tracker"
version = "0.2.0"
edition = "2021"

[lib]
name = "token_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
env_logger = "0.11"
log = "0.4"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
